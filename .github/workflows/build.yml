name: Build iSH-AOK IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build App
        run: |
          # 1. Search for the specific AOK project file
          PROJECT_PATH=$(find . -name "iSH-AOK.xcodeproj" -type d | head -n 1)
          echo "Found project at: $PROJECT_PATH"
          
          # 2. Build using the AOK project name
          # Note: We use -scheme iSH because the scheme usually keeps its original name
          xcodebuild -project "$PROJECT_PATH" -scheme iSH -sdk iphoneos -configuration Release \
          CODE_SIGNING_ALLOWED=NO OBJROOT=$PWD/build SYMROOT=$PWD/build

      - name: Create IPA
        run: |
          mkdir -p Payload
          # 3. Find the compiled app in the build output
          APP_PATH=$(find build -name "iSH.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r iSH-AOK.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-aok-sideload-me
          path: iSH-AOK.ipa
