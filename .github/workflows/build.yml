name: Build iSH-AOK IPA
on: workflow_dispatch # Allows you to run it manually

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build App
        run: |
          xcodebuild -project iSH.xcodeproj -scheme iSH -sdk iphoneos -configuration Release \
          CODE_SIGNING_ALLOWED=NO OBJROOT=$PWD/build SYMROOT=$PWD/build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/iSH.app Payload/
          zip -r iSH-AOK.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-aok-sideload-me
          path: iSH-AOK.ipa
