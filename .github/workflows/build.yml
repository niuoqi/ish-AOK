name: Build iSH-AOK IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Debug Project Info
        run: |
          PROJECT_PATH=$(find . -name "iSH-AOK.xcodeproj" -type d | head -n 1)
          xcodebuild -list -project "$PROJECT_PATH"

      - name: Build App
        run: |
          PROJECT_PATH=$(find . -name "iSH-AOK.xcodeproj" -type d | head -n 1)
          
          # We build the 'iSH' TARGET directly. This is more reliable than Schemes in CI.
          xcodebuild -project "$PROJECT_PATH" \
            -target "iSH" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          # Locate the .app file in the build folder
          APP_PATH=$(find . -name "iSH.app" -type d | grep "Release-iphoneos" | head -n 1)
          echo "Found App at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r iSH-AOK.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-aok-final
          path: iSH-AOK.ipa
