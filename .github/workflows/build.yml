name: Build iSH-AOK IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build All Targets
        run: |
          PROJECT_PATH=$(find . -name "iSH-AOK.xcodeproj" -type d | head -n 1)
          
          # We use -alltargets to avoid the "Target not found" error
          xcodebuild -project "$PROJECT_PATH" \
            -alltargets \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            OBJROOT=$PWD/build \
            SYMROOT=$PWD/build \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          # Search the build folder for the actual .app file produced
          APP_PATH=$(find build/Release-iphoneos -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app file found in build directory!"
            exit 1
          fi
          
          echo "Found App at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r iSH-AOK.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-aok-sideload-me
          path: iSH-AOK.ipa
