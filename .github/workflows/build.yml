name: Build iSH-AOK IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Archive
        run: |
          # 1. Locate the AOK-specific project file
          PROJECT_PATH=$(find . -name "iSH-AOK.xcodeproj" -type d | head -n 1)
          echo "Building project at: $PROJECT_PATH"

          # 2. Archive the app (Bypasses 'iSH-AOK pre' script hangs)
          # We use -scheme iSH as it is the standard app scheme in the AOK fork
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme iSH \
            -archivePath $PWD/build/iSH.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          # 3. Extract the compiled .app from the archive
          APP_PATH=$(find build/iSH.xcarchive -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r iSH-AOK.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-aok-jit-build
          path: iSH-AOK.ipa
