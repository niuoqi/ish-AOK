name: Build iSH-AOK IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build App
        run: |
          PROJECT_PATH=$(find . -name "iSH-AOK.xcodeproj" -type d | head -n 1)
          
          # Target 'iSH-AOK' specifically to avoid the "Multiple commands produce" error
          xcodebuild -project "$PROJECT_PATH" \
            -target "iSH-AOK" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            OBJROOT=$PWD/build \
            SYMROOT=$PWD/build \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          # Find the .app folder and zip it
          APP_PATH=$(find build/Release-iphoneos -name "iSH-AOK.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r iSH-AOK.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-aok-jit-build
          path: iSH-AOK.ipa
